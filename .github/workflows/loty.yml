name: Sprawdzanie cen lotów

on:
  schedule:
    # GitHub potrafi pominąć zaplanowane uruchomienie – dlatego poranne sprawdzenie robi pierwsze
    # uruchomienie po 6:00 (czas polski), jeśli dziś jeszcze go nie było (czy_sprawdzac.py).
    - cron: "15 5 * * *"   # ok. 6:15 czasu polskiego zimą
    # Co 10 minut: GitHub pomija wiele zaplanowanych uruchomień (godzinne ruszało co 3–5 godzin),
    # a zadanie „plan” bez zlecenia kończy się w kilka sekund.
    - cron: "*/10 * * * *" # „Sprawdź teraz” z aplikacji i zapas dla porannego
  workflow_dispatch:

env:
  DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
  DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
  DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}

jobs:
  # Krótka decyzja i lista wyjazdów. Zlecenia „Sprawdź teraz” są tu od razu przyjmowane.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: loty-plan
      cancel-in-progress: false
    outputs:
      uruchom: ${{ steps.decyzja.outputs.uruchom }}
      powod: ${{ steps.decyzja.outputs.powod }}
      wyjazdy: ${{ steps.decyzja.outputs.wyjazdy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Czy sprawdzać teraz
        id: decyzja
        run: python czy_sprawdzac.py

  # Każdy wyjazd w osobnym, równoległym zadaniu – jeden długi wyjazd nie blokuje pozostałych.
  sprawdz:
    needs: plan
    if: needs.plan.outputs.uruchom == 'tak'
    name: ${{ matrix.wyjazd }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        wyjazd: ${{ fromJSON(needs.plan.outputs.wyjazdy) }}
    concurrency:
      group: loty-${{ matrix.wyjazd }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Testy logiki
        run: python -m pytest -q testy

      - name: Sprawdzenie cen
        env:
          WYJAZD: ${{ matrix.wyjazd }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
          BRIGHT_DATA_ZONE: ${{ secrets.BRIGHT_DATA_ZONE }}
        run: python narzedzie.py --wyjazd "$WYJAZD"

  # Znacznik końca – aplikacja przestaje pokazywać „Trwa nowe sprawdzenie”.
  koniec:
    needs: [plan, sprawdz]
    if: always() && needs.plan.outputs.uruchom == 'tak'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zapis końca sprawdzania
        run: python czy_sprawdzac.py --koniec
